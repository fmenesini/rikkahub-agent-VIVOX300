# Builds the debug APK and publishes it as a prerelease. Runs only when a tag starting with
# "apk-" is pushed (or by hand), so ordinary pushes cost nothing. The APK is debug-signed:
# for testing on the Vivo X300, not for distribution.
name: Debug APK release

on:
  push:
    tags: ["apk-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Gradle itself; the build's JetBrains 21 toolchain is fetched via foojay.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "cmake;3.22.1"

      # :web runs bun install + pnpm run build on every preBuild.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build debug APK
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="apk-manual-${GITHUB_RUN_NUMBER}"; fi
          dir=app/build/outputs/apk/debug
          arm="rikkahub-agent-${tag}-arm64-v8a-debug.apk"
          cp "$dir/app-arm64-v8a-debug.apk" "$arm"
          sha256sum "$arm" > "$arm.sha256"
          gh release create "$tag" "$arm" "$arm.sha256" \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Debug APK ${tag}" \
            --notes "Debug build of ${GITHUB_SHA::7} for the Vivo X300 (arm64-v8a, package excp.rikkahub.debug). Debug-signed, not for distribution. Install: adb install -r ${arm}"
